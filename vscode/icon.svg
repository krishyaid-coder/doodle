<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="doodle">
  <title>doodle</title>

  <!-- lime background -->
  <rect width="128" height="128" rx="24" fill="#BEF264"/>

  <!-- character body -->
  <path d="M 64 22
           C 88 22, 106 40, 106 62
           C 106 82, 90 96, 64 96
           C 38 96, 22 82, 22 62
           C 22 40, 40 22, 64 22 Z"
        fill="white" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>

  <!-- eyes -->
  <ellipse cx="50" cy="58" rx="4.5" ry="6.5" fill="#1A1A1A"/>
  <circle cx="52" cy="55" r="1.5" fill="white"/>
  <ellipse cx="78" cy="58" rx="4.5" ry="6.5" fill="#1A1A1A"/>
  <circle cx="80" cy="55" r="1.5" fill="white"/>

  <!-- smile -->
  <path d="M 45 72 Q 64 86, 83 72"
        fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>

  <!-- cheek marks -->
  <g stroke="#65A30D" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="30" y1="66" x2="38" y2="65"/>
    <line x1="30" y1="72" x2="38" y2="71"/>
    <line x1="90" y1="65" x2="98" y2="66"/>
    <line x1="90" y1="71" x2="98" y2="72"/>
  </g>

  <!-- checkmark badge -->
  <g transform="translate(104 104)">
    <circle r="16" fill="white" stroke="#047857" stroke-width="3"/>
    <path d="M -7 -1 L -2 5 L 8 -6"
          fill="none" stroke="#047857" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
